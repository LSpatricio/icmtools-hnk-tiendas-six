<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8" />
    <title>404 — Página no encontrada</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <!-- Fallback: si JS falla, redirecciona en 3 segundos -->
    <meta http-equiv="refresh" content="5;url=/Pages/Home.aspx" />

    <style>
        :root {
            --bg: #f5f7fb;
            --card: #ffffff;
            --text: #111827;
            --muted: #6b7280;
            --primary: #2563eb;
            --primary-600: #1d4ed8;
            --border: #e5e7eb;
            --ring: rgba(37, 99, 235, .25);
            --code-bg: #eff6ff;
            --code-bd: #bfdbfe;
            --shadow: 0 10px 25px rgba(0,0,0,.06);
            --success: #059669;
        }

        * {
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
        }

        body {
            margin: 0;
            font-family: "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: radial-gradient(1200px 800px at 50% -10%, rgba(37,99,235,.05), transparent 70%), var(--bg);
            color: var(--text);
            display: grid;
            place-items: center;
            padding: 24px;
        }

        .card {
            width: 100%;
            max-width: 500px;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 14px;
            box-shadow: var(--shadow);
            overflow: hidden;
            outline: none;
            animation: fadein .35s ease-out;
        }

        @keyframes fadein {
            from {
                opacity: 0;
                transform: translateY(8px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .header {
            display: grid;
            grid-template-columns: auto 1fr;
            gap: 18px;
            padding: 28px 28px 12px 28px;
            align-items: center;
            border-bottom: 1px solid var(--border);
            background: linear-gradient(180deg, #ffffff, #f9f9f9);
        }

        .badge {
            width: 64px;
            height: 64px;
            border-radius: 14px;
            display: grid;
            place-items: center;
            background: var(--code-bg);
            border: 1px solid var(--code-bd);
        }

            .badge svg {
                width: 36px;
                height: 36px;
            }

        h1 {
            margin: 0;
            font-size: 22px;
            font-weight: 800;
            letter-spacing: .2px;
        }

        .subtitle {
            margin: 6px 0 0 0;
            color: var(--muted);
            font-size: 14px;
        }

        .content {
            padding: 22px 28px 26px 28px;
            gap: 18px;
        }

        .pill {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 6px 10px;
            border-radius: 999px;
            background: var(--code-bg);
            border: 1px solid var(--code-bd);
            color: var(--text);
            font-size: 13px;
            width: max-content;
        }

            .pill .dot {
                width: 7px;
                height: 7px;
                background: var(--success);
                border-radius: 50%;
                box-shadow: 0 0 0 3px rgba(5,150,105,.15);
            }

        .actions {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-top: 6px;
        }

        .btn {
            appearance: none;
            border: 1px solid var(--border);
            background: #fff;
            color: var(--text);
            padding: 10px 16px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            transition: transform .05s ease, box-shadow .15s ease;
            box-shadow: 0 1px 0 rgba(0,0,0,.03);
        }

            .btn.primary {
                background: var(--primary);
                color: #fff;
                border-color: var(--primary-600);
                box-shadow: 0 6px 16px var(--ring);
            }

            .btn:hover {
                transform: translateY(-1px);
            }

            .btn:focus-visible {
                outline: 3px solid var(--ring);
                outline-offset: 2px;
            }

        .footer {
            padding: 16px 24px;
            border-top: 1px solid var(--border);
            color: var(--muted);
            font-size: 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 8px;
        }

        .kbd {
            font-family: ui-monospace, SFMono-Regular, Menlo, Consolas;
            background: var(--code-bg);
            border: 1px solid var(--code-bd);
            padding: 2px 6px;
            border-radius: 6px;
            font-size: 12px;
        }

        @media (min-width: 720px) {
            .content {
                grid-template-columns: 1.2fr .8fr;
                gap: 22px;
            }
        }
    </style>
</head>

<body>
    <main class="card" tabindex="-1" aria-labelledby="title" aria-describedby="desc">
        <header class="header">
            <div class="badge" aria-hidden="true">
                <!-- Ícono minimalista: ubicación con cruz -->
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
                    <path stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"
                          d="M12 21s-6-4.35-6-10a6 6 0 1 1 12 0c0 5.65-6 10-6 10Z" />
                    <path stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"
                          d="M9.75 9.75l4.5 4.5m0-4.5l-4.5 4.5" />
                </svg>
            </div>

            <div>
                <h1 id="title">Página no encontrada</h1>
                <p id="desc" class="subtitle">No pudimos localizar el recurso solicitado.</p>
            </div>
        </header>

        <section class="content">
            <div>
                <p>
                    Puede que el enlace haya sido movido o ya no exista.<br />
                    Serás redirigido automáticamente al inicio.
                </p>

                <div class="actions">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
                        <path d="M5 12h14M13 5l7 7-7 7"
                              stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" />
                    </svg>
                    <a href="Home.aspx">
                        Ir al inicio
                    </a>
                </div>

                <p class="pill">
                    <span class="dot"></span>
                    Redirigiendo en <span id="counter">5</span> segundos…
                </p>
            </div>
        </section>

        <footer class="footer">
            <span>© <span id="year"></span> Todos los derechos reservados.</span>
            <span class="subtitle">Error 404</span>
        </footer>
    </main>

    <script>
    let targetUrl = '/Pages/Home.aspx';
    let seconds = 5;
    let counterEl = document.getElementById('counter');
    let card = document.querySelector('.card');

    card && card.focus();

    counterEl.textContent = seconds;
    let n = seconds;
    setInterval(() => {
      n -= 1;
      if (n >= 0) counterEl.textContent = n;
    }, 1000);

    setTimeout(() => {
      window.location.replace(targetUrl);
    }, seconds * 1000);

    document.addEventListener('keydown', e => {
      if (e.key === 'Enter') {
        window.location.href = targetUrl;
      }
    });

    document.getElementById('year').textContent = new Date().getFullYear();
    </script>
</body>
</html>
